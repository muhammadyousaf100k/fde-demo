# REUSABLE WORKFLOW: written once by the platform team, called by every product repo.
# Demo points:
#   1. on: workflow_call  -> makes it reusable
#   2. id-token: write    -> OIDC, no password or client secret stored anywhere
#   3. environment:       -> production waits for a human approval before it runs
name: Reusable - Deploy to Azure Web App

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      app-name:
        type: string
        required: true

permissions:
  id-token: write           # lets GitHub mint a short-lived OIDC token
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci && npm run build --if-present

      - name: Azure login (OIDC - no secrets)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}           # IDs, not passwords
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ inputs.app-name }}
          package: .
