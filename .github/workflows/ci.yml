# CI: runs on every pull request and push to main.
# Demo point: these job names become REQUIRED status checks in the ruleset,
# so nothing merges to main unless build, tests and security all pass.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read            # least privilege by default

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm        # caching = faster pipelines (talk point: optimization)
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test --if-present
      - run: npm run build --if-present

  dependency-review:
    # Blocks PRs that add packages with known high-severity vulnerabilities
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
