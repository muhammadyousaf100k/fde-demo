# CodeQL code scanning (SAST). Free on public repos.
# Demo point: vulnerabilities show up as annotations on the PR and in the Security tab.
name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"    # weekly full scan

permissions:
  contents: read
  security-events: write    # needed to upload results to the Security tab

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
